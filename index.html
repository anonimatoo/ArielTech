<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário Imobiliário - Agência da Praia Imóveis</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap">
  <script src="script.js" defer></script>
</head>
<body class="bg-dark-blue">
  <header>
    <img src="logo.jpg" alt="Agência da Praia Imóveis Logo" class="logo">
    <div class="header-text">
      <h1>Amanda Kaiuby</h1>
      <h2>Agência da Praia Grande</h2>
      <p>Corretora de Imóveis - Creci 285515-F</p>
    </div>
  </header>

  <main>
    <form id="formularioImobiliario">
      <section class="form-section">
        <h2>FORMULÁRIO LOCAÇÃO PESSOA FÍSICA</h2>
        <div class="form-group">
          <label for="rgCpf">RG e CPF (se casado, do casal) cópias digitalizadas, documento aberto frente e verso na mesma foto:</label>
          <input type="file" id="rgCpf" name="rgCpf" accept="image/*" multiple>
        </div>
        <div class="form-group">
          <label for="certidaoCasamento">Certidão de casamento (óbito, divórcio quando for o caso):</label>
          <input type="file" id="certidaoCasamento" name="certidaoCasamento" accept="image/*">
        </div>
        <div class="form-group">
          <label for="comprovantesRenda">3 últimos comprovantes de rendimento (que somados sejam superior a 03 vezes o valor do aluguel):</label>
          <input type="file" id="comprovantesRenda" name="comprovantesRenda" accept="image/*" multiple>
        </div>
        <div class="form-group">
          <label for="comprovanteResidencia">Comprovante de residência (Luz, Água ou telefone):</label>
          <input type="file" id="comprovanteResidencia" name="comprovanteResidencia" accept="image/*">
        </div>
        <div class="form-group">
          <label for="declaracaoIR">Declaração de Imposto de Renda completa:</label>
          <input type="file" id="declaracaoIR" name="declaracaoIR" accept="image/*">
        </div>
        <div class="form-group">
          <label for="recibosAluguel">Os três últimos recibos de pagamento, se estiver pagando aluguel:</label>
          <input type="file" id="recibosAluguel" name="recibosAluguel" accept="image/*" multiple>
        </div>
        <div class="form-group">
          <label for="fichaCadastral">Ficha cadastral preenchida e assinada:</label>
          <input type="file" id="fichaCadastral" name="fichaCadastral" accept="image/*">
        </div>
      </section>

      <button type="submit" class="submit-button">Enviar Documentos</button>
    </form>
  </main>

  <footer>
    <p>© Site seguro</p>
  </footer>
</body>
</html>
